{% extends "core_app/base.html" %}
{% block title %}注册 - 岩心智能识别系统{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-panel">
    <div class="brand-mark">RC</div>
    <h1>创建检测账号</h1>
    <p>注册后即可保存检测记录并导出评价报告</p>
    <form method="post" class="auth-form">
      {% csrf_token %}
      <label>用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="new-password" required></label>
      {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
      <button type="submit">注册</button>
    </form>
    <a class="auth-link" href="{% url 'login' %}">已有账号？返回登录</a>
  </section>
</main>
{% endblock %}
